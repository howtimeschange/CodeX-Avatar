[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-avatar"
version = "0.2.0"
description = "CodeX Avatar: guarded personal AI agent for DingTalk and future chat channels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Yicheng Kim", email = "xingyicheng@gmail.com" }
]
keywords = ["dingtalk", "codex", "agent", "auto-reply"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
codex-avatar = "codex_avatar.worker:main"
codex-avatar-ui = "codex_avatar.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_avatar = ["static/*"]
